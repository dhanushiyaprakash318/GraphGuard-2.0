services:
  # Optional local Postgres. Skip when DATABASE_URL points at Supabase:
  #   docker compose up --build api web
  # Local DB stack:
  #   docker compose --profile local-db up --build
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graphguard
      POSTGRES_PASSWORD: graphguard
      POSTGRES_DB: graphguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphguard -d graphguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    # Prefer IPv4 DNS — Supabase direct hosts are often IPv6-only and break in Docker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - path: .env
        required: false
    environment:
      # Prefer .env DATABASE_URL (Supabase Session pooler recommended). Fallback = local-db.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://graphguard:graphguard@db:5432/graphguard}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      MODEL_PATH: app/models/graphguard_prediction_bundle.joblib
      MODEL_VERSION: ${MODEL_VERSION:-graphguard-lgbm-v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FABRIC_SQL_ENDPOINT: ${FABRIC_SQL_ENDPOINT:-}
      FABRIC_DATABASE: ${FABRIC_DATABASE:-}
      FABRIC_CLIENT_ID: ${FABRIC_CLIENT_ID:-}
      FABRIC_CLIENT_SECRET: ${FABRIC_CLIENT_SECRET:-}
      FABRIC_TENANT_ID: ${FABRIC_TENANT_ID:-}
      FABRIC_EVENTSTREAM_URL: ${FABRIC_EVENTSTREAM_URL:-}
      FABRIC_EVENTHUB_CONNECTION_STRING: ${FABRIC_EVENTHUB_CONNECTION_STRING:-}
      FABRIC_EVENTHUB_NAME: ${FABRIC_EVENTHUB_NAME:-}
      FABRIC_WORKSPACE: ${FABRIC_WORKSPACE:-GraphGuard_Fabric_Analytics}
      FABRIC_LAKEHOUSE: ${FABRIC_LAKEHOUSE:-GraphGuard_Lakehouse}
      FABRIC_EVENTSTREAM_NAME: ${FABRIC_EVENTSTREAM_NAME:-ES_GraphGuard_Lakehouse}
      FABRIC_INCOMING_TABLE: ${FABRIC_INCOMING_TABLE:-graphguard_incoming_events_stream_v5}
      FABRIC_PREDICTIONS_TABLE: ${FABRIC_PREDICTIONS_TABLE:-realtime_fraud_predictions}
      FABRIC_TIMEOUT_SECONDS: ${FABRIC_TIMEOUT_SECONDS:-10}
      FABRIC_MAX_RETRIES: ${FABRIC_MAX_RETRIES:-2}
      FABRIC_SYNC_ENABLED: ${FABRIC_SYNC_ENABLED:-true}
      FABRIC_SYNC_INTERVAL_SECONDS: ${FABRIC_SYNC_INTERVAL_SECONDS:-30}
    volumes:
      - ./backend/app/models:/app/app/models:ro
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 25s
      retries: 8
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
