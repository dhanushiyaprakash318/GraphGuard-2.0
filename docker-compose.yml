services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graphguard
      POSTGRES_PASSWORD: graphguard
      POSTGRES_DB: graphguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphguard -d graphguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://graphguard:graphguard@db:5432/graphguard
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      MODEL_PATH: app/models/graphguard_prediction_bundle.joblib
      MODEL_VERSION: graphguard-lgbm-v1
      LOG_LEVEL: INFO
    volumes:
      - ./backend/app/models:/app/app/models:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
